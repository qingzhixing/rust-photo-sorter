[workspace.package]
authors = ["qingzhixing <qzsqqmail@qq.com>"]
description = "A photo sorter written in Rust."
license = "GPL-3.0"
version = "0.1.0"
homepage = "https://github.com/qingzhixing/rust-photo-sorter"

[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
# 文件遍历
walkdir = "2"

# EXIF 读取
kamadak-exif = "0.5"

# 日期时间 读取
chrono = "0.4"

# 自定义错误
thiserror = "1"

# 命令行解析
clap = { version = "4", features = ["derive"] }

# 错误处理
anyhow = "1"

# GUI
eframe = { version = "0.36" }

# 文件对话框
rfd = "0.14"

# logger
log = "0.4"
env_logger = "0.11"

# Windows API（release 版 GUI 把日志接回控制台）
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
] }

# 把图标资源编进 Windows 的 exe（只在各 crate 的 build.rs 里用）
winresource = "0.1"
